name: Test shards
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      # Run the suite in a crew's environment rather than a plain one.
      crew:
        required: true
        type: boolean
permissions:
  contents: read
# A machine that cannot make the qualification's sandbox fails those tests
# here, where elsewhere they skip and say why.
env:
  PRIVATEER_SANDBOX_QUALIFICATION: '1'
jobs:
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [slow-1, slow-2, slow-3, slow-4, slow-5, rest]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The shards, the dashboard smoke and the pilot run Python; pin it so a
      # runner image change cannot move the interpreter under them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: matrix.shard == 'slow-1'   # the MCP door checks below need uv
        with:
          version: '0.13.0'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # All shards build the same dependencies. One successful main
          # shard writes the shared cache; PRs only restore it.
          shared-key: test-${{ inputs.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'slow-2' }}
      # #736 qualification (docs/design/codex-sandboxed-launch.md, (f)):
      # tests/sandboxed_launch.rs and review_gate run first-mate calls inside
      # a Codex-like sandbox, bwrap on Linux and sandbox-exec (built in) on
      # macOS. CI only: nothing at runtime installs or configures either.
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through
      # AppArmor, which bwrap --unshare-user needs; lift that on the runner.
      - name: Install bubblewrap for the sandbox qualification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --dev /dev --proc /proc true
      - run: cargo fmt --check
        if: matrix.shard == 'slow-2'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        if: matrix.shard == 'slow-2'
      - run: python3 scripts/test-shard.py ${{ matrix.shard }}
        if: ${{ !inputs.crew }}
      - name: python3 scripts/test-shard.py ${{ matrix.shard }} as crew
        if: inputs.crew
        run: |
          mkdir -p /tmp/privateer-crew-gh-config
          python3 scripts/test-shard.py ${{ matrix.shard }}
        env:
          PRIVATEER_ROLE: agent
          PRIVATEER_ACTOR: crew-check
          PRIVATEER_JOB: crew-check
          PRIVATEER_HOME: /nonexistent/privateer-home
          PRIVATEER_PRESENCE_HOLDER: crew-check
          # A crew's gate also points gh at the job's own empty config dir;
          # no fixture may inherit that login state.
          GH_CONFIG_DIR: /tmp/privateer-crew-gh-config
      - name: Bootstrap and test the opt-in MCP door (isolated SDK client)
        if: matrix.shard == 'slow-1'
        run: |
          sh plugins/mcp/bootstrap.sh "$RUNNER_TEMP/privateer-mcp-venv" "$(command -v python3)"
          cargo build --locked --bin privateer
          PRIVATEER_TEST_BINARY="$PWD/target/debug/privateer" "$RUNNER_TEMP/privateer-mcp-venv/bin/python" tests/mcp_door_test.py
          PRIVATEER_TEST_BINARY="$PWD/target/debug/privateer" "$RUNNER_TEMP/privateer-mcp-venv/bin/python" tests/mcp_oauth_test.py
          PRIVATEER_TEST_BINARY="$PWD/target/debug/privateer" "$RUNNER_TEMP/privateer-mcp-venv/bin/python" tests/mcp_grant_edit_test.py
          PRIVATEER_TEST_BINARY="$PWD/target/debug/privateer" "$RUNNER_TEMP/privateer-mcp-venv/bin/python" tests/mcp_files_test.py
      - run: cargo check --locked --no-default-features --bin privateer
        if: matrix.shard == 'slow-1'
      # slow-1 also builds the dashboard it smokes and the privateer binary
      # the MCP checks and the pilot drive; the build is shared within the job.
      - run: |
          cargo build --locked --all-features --bin privateer-dashboard
          python3 scripts/dashboard-smoke.py --binary target/debug/privateer-dashboard
        if: matrix.shard == 'slow-1'
      - run: python3 scripts/pilot.py --binary target/debug/privateer
        if: matrix.shard == 'slow-1'
