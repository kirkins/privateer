name: Privateer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The suite runs as parallel shards (test-shards.yml) so each job ends well
  # inside its limit on a slow runner. A ship working on Privateer runs its
  # tests as crew, and nothing the crew environment sets may leak into the
  # tests' own processes: Linux runs the whole suite in that environment,
  # macOS runs it plain.
  linux:
    uses: ./.github/workflows/test-shards.yml
    with:
      os: ubuntu-latest
      crew: true
  macos:
    uses: ./.github/workflows/test-shards.yml
    with:
      os: macos-latest
      crew: false
  # One check per platform, under the name the unsharded job had, passing
  # only when every shard of that platform passed.
  runtime-linux:
    name: runtime (ubuntu-latest)
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.linux.result }}" = success
  runtime-macos:
    name: runtime (macos-latest)
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.macos.result }}" = success
  # A macOS arm64 release for machines without a Rust toolchain, in the
  # versioned release layout: <commit>/bin and <commit>/share/privateer/plugins.
  macos-release:
    name: macOS arm64 release
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo build --release --locked --features dashboard
      - name: Lay out the release
        run: |
          root="releases/$GITHUB_SHA"
          mkdir -p "$root/bin" "$root/share/privateer"
          cp target/release/privateer target/release/privateer-dashboard target/release/privateer-mcp-broker "$root/bin/"
          cp -R plugins "$root/share/privateer/plugins"
          # The image must know itself as this exact release.
          "$root/bin/privateer" upgrade status | grep -q "\"running_commit\": \"$GITHUB_SHA\""
          tar -czf privateer-macos-arm64.tar.gz -C releases "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: privateer-macos-arm64-${{ github.sha }}
          path: privateer-macos-arm64.tar.gz
  # The same layout for Linux x86_64 servers. The binaries link against the
  # runner's glibc, so the image is pinned (not ubuntu-latest, which moves to
  # each new LTS) and they run on Ubuntu 24.04 (glibc 2.39) and newer.
  linux-release:
    name: Linux x86_64 release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo build --release --locked --features dashboard
      - name: Lay out the release
        run: |
          root="releases/$GITHUB_SHA"
          mkdir -p "$root/bin" "$root/share/privateer"
          cp target/release/privateer target/release/privateer-dashboard target/release/privateer-mcp-broker "$root/bin/"
          cp -R plugins "$root/share/privateer/plugins"
          # The image must know itself as this exact release.
          "$root/bin/privateer" upgrade status | grep -q "\"running_commit\": \"$GITHUB_SHA\""
          # Fail if any binary needs a glibc newer than the floor above.
          need=$(objdump -T "$root"/bin/* | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol: $need"
          test "$(printf '%s\n' "$need" 2.39 | sort -V | tail -1)" = 2.39
          tar -czf privateer-linux-x86_64.tar.gz -C releases "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: privateer-linux-x86_64-${{ github.sha }}
          path: privateer-linux-x86_64.tar.gz
