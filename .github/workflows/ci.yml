name: Privateer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      # A ship working on Privateer runs its tests as crew. Nothing the
      # crew environment sets may leak into the tests' own processes.
      - name: cargo test as crew
        if: runner.os == 'Linux'
        run: cargo test --locked --all-features
        env:
          PRIVATEER_ROLE: agent
          PRIVATEER_ACTOR: crew-check
          PRIVATEER_JOB: crew-check
          PRIVATEER_HOME: /nonexistent/privateer-home
          PRIVATEER_PRESENCE_HOLDER: crew-check
      - run: cargo check --locked --no-default-features --bin privateer
      - run: python3 scripts/dashboard-smoke.py --binary target/debug/privateer-dashboard
      - run: python3 scripts/pilot.py --binary target/debug/privateer
  # A macOS arm64 release for machines without a Rust toolchain, in the
  # versioned release layout: <commit>/bin and <commit>/share/privateer/plugins.
  macos-release:
    name: macOS arm64 release
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo build --release --locked --features dashboard
      - name: Lay out the release
        run: |
          root="releases/$GITHUB_SHA"
          mkdir -p "$root/bin" "$root/share/privateer"
          cp target/release/privateer target/release/privateer-dashboard "$root/bin/"
          cp -R plugins "$root/share/privateer/plugins"
          # The image must know itself as this exact release.
          "$root/bin/privateer" upgrade status | grep -q "\"running_commit\": \"$GITHUB_SHA\""
          tar -czf privateer-macos-arm64.tar.gz -C releases "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: privateer-macos-arm64-${{ github.sha }}
          path: privateer-macos-arm64.tar.gz
