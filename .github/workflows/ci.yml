name: Privateer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Replace only runs for the same PR. Push/dispatch runs keep distinct groups
# so every main commit retains its own release artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  checks:
    name: Docs and CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the PR's merge base, with no API file-count limit. Disabling
          # rename detection makes a move out of runtime code visible too.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s scripts -p 'test_ci*.py'
      - run: python3 scripts/ci.py check-docs
      - run: npx --yes markdownlint-cli2@0.24.0 '*.md' 'docs/**/*.md'
      - id: plan
        run: python3 scripts/ci.py plan
  # The suite runs as parallel shards (test-shards.yml) so each job ends well
  # inside its limit on a slow runner. A ship working on Privateer runs its
  # tests as crew, and nothing the crew environment sets may leak into the
  # tests' own processes: Linux runs the whole suite in that environment,
  # macOS runs it plain.
  linux:
    needs: checks
    if: needs.checks.outputs.runtime == 'true'
    uses: ./.github/workflows/test-shards.yml
    with:
      os: ubuntu-latest
      crew: true
  macos:
    needs: checks
    if: needs.checks.outputs.runtime == 'true'
    uses: ./.github/workflows/test-shards.yml
    with:
      os: macos-latest
      crew: false
  # One check per platform, under the name the unsharded job had, passing
  # only when every shard passed, or the checked PR contains only docs/research.
  # A failed/cancelled classifier or an unexpected skip must never pass.
  runtime-linux:
    name: runtime (ubuntu-latest)
    needs: [checks, linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$PASSED" = true
        env:
          PASSED: >-
            ${{ needs.checks.result == 'success' &&
                ((needs.checks.outputs.runtime == 'true' && needs.linux.result == 'success') ||
                 (needs.checks.outputs.runtime == 'false' && needs.linux.result == 'skipped')) }}
  runtime-macos:
    name: runtime (macos-latest)
    needs: [checks, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$PASSED" = true
        env:
          PASSED: >-
            ${{ needs.checks.result == 'success' &&
                ((needs.checks.outputs.runtime == 'true' && needs.macos.result == 'success') ||
                 (needs.checks.outputs.runtime == 'false' && needs.macos.result == 'skipped')) }}
  # A release for each platform CI builds, for machines without a Rust
  # toolchain, in the versioned release layout scripts/release-layout.sh
  # writes: <commit>/bin, <commit>/share/privateer/plugins and
  # <commit>/SHA256SUMS. `privateer upgrade fetch` finds the job by its name
  # and the artifact by privateer-<platform>-<commit>, and checks the
  # artifact's digest and then SHA256SUMS. Linux binaries link against the
  # runner's glibc, so the images are pinned (not ubuntu-latest, which moves
  # to each new LTS) and they run on Ubuntu 24.04 (glibc 2.39) and newer.
  release:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 release
            platform: macos-arm64
            os: macos-latest
          - name: Linux x86_64 release
            platform: linux-x86_64
            os: ubuntu-24.04
          - name: Linux aarch64 release
            platform: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.platform }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --features dashboard
      # Lays out releases/<commit>, writes SHA256SUMS and checks that the
      # image knows itself as this exact release.
      - run: scripts/release-layout.sh "$GITHUB_SHA" target/release plugins releases
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          # Fail if any binary needs a glibc newer than the floor above.
          need=$(objdump -T releases/"$GITHUB_SHA"/bin/* | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol: $need"
          test "$(printf '%s\n' "$need" 2.39 | sort -V | tail -1)" = 2.39
      - run: tar -czf privateer-${{ matrix.platform }}.tar.gz -C releases "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: privateer-${{ matrix.platform }}-${{ github.sha }}
          path: privateer-${{ matrix.platform }}.tar.gz
