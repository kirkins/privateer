[package]
name = "privateer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small runtime for autonomous peer agents working under a charter"
license = "MIT"
default-run = "privateer"

[features]
dashboard = ["dep:ratatui", "dep:crossterm", "rusqlite/hooks"]
# Tests only: honour PRIVATEER_SUDO, PRIVATEER_TEST_TTY and
# PRIVATEER_TEST_TRUST_UID in `privileged run`. Never enable in a release.
test-sudo = []

[[bin]]
name = "privateer-dashboard"
path = "src/bin/privateer-dashboard.rs"
required-features = ["dashboard"]

# Std, libc, serde_json and sha2 only: never the privateer library, so the
# installed copy stays the same file across Privateer upgrades.
[[bin]]
name = "privateer-mcp-broker"
path = "src/bin/privateer-mcp-broker.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", optional = true }
# Exact: a pre-1.0 parser whose event stream src/input/yaml.rs walks
# directly, and whose nesting, node-count and alias-expansion bounds
# tests/input.rs checks against this release. Bump it deliberately and
# rerun that suite.
saphyr-parser = "=0.2.1"

[[test]]
name = "privileged"
required-features = ["test-sudo"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
