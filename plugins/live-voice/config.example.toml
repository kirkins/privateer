# Live voice front door: private settings. Every key is optional.
#
#   install -m 600 plugins/live-voice/config.example.toml ~/.config/privateer/live-voice.toml
#   privateer door add live-voice --config ~/.config/privateer/live-voice.toml
#
# The page listens on 127.0.0.1 only, at this port.
port = 8765

# The Codex CLI that runs `codex app-server`, logged in with ChatGPT
# (`codex login`). A path, or an argv list such as ["/opt/codex/bin/codex"].
codex = "codex"

# The realtime model and protocol version Codex is asked for.
model = "gpt-live-1-codex"
version = "v3"

# Seconds a read-back message waits for you to say "send to <ship>" before it
# is dropped.
draft_ttl_secs = 60

# The page checks in every second. A session whose page has not checked in for
# this many seconds (a closed tab) is stopped, and queued mail waits.
heartbeat_secs = 10

# How the door puts its own words (notices, read-backs, results) into the
# session: "text" (appendText, framed as "say this to the captain") or
# "speech" (appendSpeech, spoken as given). And the appendText role.
speak_with = "text"
speak_role = "user"

# Optional: replaces Codex's own realtime voice prompt. Leave unset normally.
# voice_prompt = ""

# Timeouts, in seconds.
start_timeout_secs = 30
rpc_timeout_secs = 20
grace_secs = 3
